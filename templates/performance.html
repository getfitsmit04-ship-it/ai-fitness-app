<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance - AI Fitness</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ timestamp }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1 class="logo">AI.FIT</h1>
            <nav>
                <a href="/dashboard">Dashboard</a>
                <a href="/performance" class="active">Performance</a>
                <a href="/logout">Logout</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2>Your Progress Overview</h2>
        <p>See your body and strength improvement over time! 📈</p>
        <p>Today is <b>{{ current_date }}</b></p>

        <h3>Bodyweight Over Time</h3>
        <canvas id="weightChart"></canvas>

        <h3>Total Workout Volume (kg)</h3>
        <canvas id="volumeChart"></canvas>

        <div id="exercise-charts-container"></div>
    </main>

    <script>
        async function loadPerformance() {
            const res = await fetch('/api/get_performance_data');
            const data = await res.json();

            function createLineChart(ctx, labels, dataset, color) {
                return new Chart(ctx, {
                    type: 'line',
                    data: { labels: labels, datasets: [{ label: dataset.label, data: dataset.data, borderColor: color, fill: false, tension: 0.3, pointRadius: 5 }] },
                    options: { responsive: true, scales: { y: { beginAtZero: true } } }
                });
            }

            createLineChart(document.getElementById('weightChart').getContext('2d'), data.weight_logs.labels, { label: 'Bodyweight (kg)', data: data.weight_logs.data }, 'blue');
            createLineChart(document.getElementById('volumeChart').getContext('2d'), data.volume_logs.labels, { label: 'Total Volume', data: data.volume_logs.data }, 'green');

            const container = document.getElementById('exercise-charts-container');
            for (const [exercise, chartData] of Object.entries(data.exercise_progression)) {
                const div = document.createElement('div');
                div.innerHTML = `<h3>${exercise} 1RM Progression</h3><canvas id="chart-${exercise}"></canvas>`;
                container.appendChild(div);
                createLineChart(document.getElementById(`chart-${exercise}`).getContext('2d'), chartData.labels, { label: exercise, data: chartData.data }, 'red');
            }
        }

        loadPerformance();
    </script>
</body>
</html>
