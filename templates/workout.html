<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Session - AI Fitness</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ timestamp }}">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1 class="logo">AI.FIT</h1>
            <nav>
                <a href="/dashboard">Dashboard</a>
                <a href="/performance">Performance</a>
                <a href="/logout">Logout</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2 id="exercise-name">Loading...</h2>
        <div class="progress-bar-container">
            <div id="progress-bar"></div>
        </div>

        <img id="exercise-gif" src="" alt="Exercise demo" style="display: none;">
        <div id="exercise-details"></div>
        <div id="exercise-instructions"></div>

        <div class="workout-controls">
            <button id="prev-exercise-btn" class="btn btn-secondary" disabled>Previous</button>
            <button id="next-exercise-btn" class="btn btn-primary">Next</button>
        </div>

        <div class="session-summary" style="display:none;">
            <h2>Workout Complete! 🎉</h2>
            <p>Calories Burned: <strong id="calories-burned">0</strong></p>
            <form id="weight-log-form">
                <label for="todays-weight">Today's Weight (kg)</label>
                <input type="number" step="0.1" id="todays-weight">
                <button type="submit" class="btn btn-primary">Save & Finish</button>
            </form>
        </div>
    </main>

    <script>
        const workoutPlan = {{ workout_data|tojson }};
        let currentStep = 0;

        function renderStep(index) {
            const step = workoutPlan.structure[index];
            if(!step) return;

            document.getElementById('exercise-name').textContent = step.details.name || step.type;
            document.getElementById('exercise-details').textContent = `${step.type} - ${step.duration || step.target || ""} ${step.rest ? `(Rest: ${step.rest})` : ""}`;
            document.getElementById('exercise-instructions').textContent = step.details.instructions || "Follow carefully and move slowly.";
            
            const gifEl = document.getElementById('exercise-gif');
            if(step.details.gif){ gifEl.src=step.details.gif; gifEl.style.display='block'; } 
            else{ gifEl.style.display='none'; }

            document.getElementById('prev-exercise-btn').disabled = index===0;
            document.getElementById('next-exercise-btn').textContent = index===workoutPlan.structure.length-1?"Finish Workout":"Next";

            document.getElementById('progress-bar').style.width = ((index+1)/workoutPlan.structure.length*100)+"%";
        }

        document.getElementById('next-exercise-btn').addEventListener('click',()=>{
            if(currentStep<workoutPlan.structure.length-1){ currentStep++; renderStep(currentStep); }
            else{ document.querySelector('.session-summary').style.display='block'; document.querySelector('#exercise-name').style.display='none'; }
        });

        document.getElementById('prev-exercise-btn').addEventListener('click',()=>{
            if(currentStep>0){ currentStep--; renderStep(currentStep); }
        });

        renderStep(currentStep);
    </script>
</body>
</html>
